# Servidor propio (señalización hbbs + relé hbbr) para el cliente.
# Uso, en un VPS Linux con Docker:
#   docker compose up -d
# Abre en el firewall: TCP 21115-21117, UDP 21116 y (opcional, web) TCP 21118-21119.
# La clave pública queda en ./data/id_ed25519.pub -> cópiala a la variable RS_PUB_KEY del repo.
services:
  hbbs:
    container_name: hbbs
    image: rustdesk/rustdesk-server:latest
    command: hbbs
    volumes:
      - ./data:/root
    network_mode: host
    depends_on:
      - hbbr
    restart: unless-stopped

  hbbr:
    container_name: hbbr
    image: rustdesk/rustdesk-server:latest
    command: hbbr
    volumes:
      - ./data:/root
    network_mode: host
    restart: unless-stopped
